[package]
name = "ytrs-tty"
version = "0.1.0"
edition = "2021"
authors = ["laguser <laguser@users.noreply.github.com>"]
description = "Fast minimalist YouTube CLI / TUI viewer in Rust with real picture thumbnails (Kitty/Sixel/Chafa), Yandex Voice-Over translation, and smart AI summaries."
license = "MIT"
repository = "https://github.com/laguser/ytrs-tty"
readme = "README.md"
keywords = ["youtube", "tui", "cli", "player", "voiceover"]
categories = ["command-line-utilities", "multimedia::video"]

[[bin]]
name = "ytrs"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"

